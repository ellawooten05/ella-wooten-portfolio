<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ella Wooten — Design Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- resets ---- */
  html, body { margin: 0; background: #f3ead0; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }

  /* ---- floating / spin keyframes for the background shapes ---- */
  @keyframes float1 { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-18px) rotate(6deg) } }
  @keyframes float2 { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(16px) rotate(-8deg) } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) rotate(0deg) } 50% { transform: translate(12px,-13px) rotate(10deg) } }
  @keyframes float4 { 0%,100% { transform: translate(0,0) rotate(0deg) } 50% { transform: translate(-14px,11px) rotate(-6deg) } }
  @keyframes spin  { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }

  /* ---- the hero fills the viewport ---- */
  .hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    background: #f3ead0;
    font-family: 'Space Grotesk', sans-serif;
  }
  .field { position: absolute; inset: 0; z-index: 0; }
  .contentcol {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    padding: clamp(24px, 3.2vw, 44px) clamp(28px, 3.6vw, 56px);
    pointer-events: none;
  }
  .center {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(24px, 3vw, 72px);
    transform: translateY(1vh);
  }

  /* ---- big title. font-size drives the name box + text (they are sized in em) ---- */
  .title {
    position: relative; margin: 0; text-align: center;
    font-family: 'Anton', sans-serif; font-weight: 400;
    line-height: .82; letter-spacing: .012em;
    text-transform: uppercase; pointer-events: auto;
    font-size: max(88px, 12.6vw);   /* grows proportionally on large monitors */
  }
  .title .line { display: block; font-size: 1em; }
  .title .line.design { color: #F26326; margin-bottom: 0.08em; }
  .title .line.portfolio { color: #241f18; }

  /* the cream cut-out box + the name text, both locked to the title's em */
  .namebox {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 4;
    background: #f3ead0;
    font-size: 0.119em; width: 13.3em; height: 3.7em;
    pointer-events: none;
  }
  .namebar {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 5;
    display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 0.119em; letter-spacing: .34em;
    color: #241f18; text-transform: uppercase; pointer-events: none;
  }

  /* ---- Explore button (em-based so it scales with its font) ---- */
  .cta {
    pointer-events: auto; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.82em;
    background: #f26327; color: #fff; font-weight: 700;
    font-size: clamp(13px, 1.4vw, 30px); letter-spacing: .03em;
    padding: 0.94em 1.18em 0.94em 1.76em; border-radius: 100px;
    transition: transform .2s, background .2s;
    box-shadow: 0 12px 30px -12px rgba(242,99,39,.7);
  }
  .cta:hover {
    transform: translateY(-2px); background: #1a5fd7;
    box-shadow: 0 12px 30px -12px rgba(26,95,215,.7);
  }
  .cta .arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2em; height: 2em; border-radius: 50%;
    background: #fff; color: #241f18; font-size: 0.94em;
  }

  /* ---- small-screen notice (below the smallest iPad) ---- */
  .smallnote {
    display: none; position: absolute; inset: 0; z-index: 20;
    background: #f3ead0; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; gap: 14px;
  }
  .smallnote span {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 16px; line-height: 1.5; color: #241f18; max-width: 300px;
  }
  @media (max-width: 760px) { .contentcol { padding: 20px; } }
  @media (max-width: 767px) { .smallnote { display: flex; } }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="field" id="field"></div>

  <div class="contentcol">
    <div class="center">
      <h1 class="title">
        <span class="line design">Design</span>
        <span class="line portfolio">Portfolio</span>
        <span class="namebox"></span>
        <span class="namebar">Ella Wooten</span>
      </h1>
      <a href="#enter" class="cta">
        Explore
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </div>

  <div class="smallnote">
    <span>This portfolio is best viewed on a tablet or desktop. Please open it on a larger screen.</span>
  </div>
</div>

<script>
/* =========================================================================
   Interactive Portfolio Hero — plain vanilla JS (no framework, no build step)
   Edit freely: shape layout lives in shapeDefs(), motion speed in SPEED.
   ========================================================================= */
(function () {
  var root = document.getElementById('hero');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED = '9s';           // ambient float speed: try '15s' (calm) or '5.5s' (lively)
  var shapes = [];
  var letters = [];
  var revealName = null;

  /* --- shape definitions ---------------------------------------------------
     t: circle | ring | domeUp | domeDown | quarter | square | squareO
     w/h in px ; x/y as % of the frame ; c: color ; d: parallax depth
     Four corner clusters of varied shapes + one "spreader" per side, with a
     clear center (x 22–78%, y 22–72%) so nothing touches the title.
  ------------------------------------------------------------------------- */
  function shapeDefs() {
    return [
      // TOP-LEFT
      { t:'circle',  w:300, h:300, x:-10, y:-13, c:'#fbd4be', d:0.02 },
      { t:'ring',    w:132, h:132, x:5,   y:10,  c:'#241f18', d:0.05 },
      { t:'circle',  w:58,  h:58,  x:18,  y:2,   c:'#f26327', d:0.12 },
      { t:'square',  w:56,  h:56,  x:13,  y:21,  c:'#f79a6b', d:0.10, rot:15 },
      { t:'domeUp',  w:140, h:70,  x:0,   y:32,  c:'#1a5fd7', d:0.06 },
      // TOP-RIGHT
      { t:'circle',  w:300, h:300, x:81,  y:-15, c:'#fbd4be', d:0.02 },
      { t:'domeDown',w:220, h:110, x:70,  y:-3,  c:'#f26327', d:0.04 },
      { t:'circle',  w:46,  h:46,  x:66,  y:10,  c:'#f79a6b', d:0.13 },
      { t:'ring',    w:86,  h:86,  x:88,  y:6,   c:'#241f18', d:0.11 },
      { t:'square',  w:132, h:132, x:89,  y:16,  c:'#6b9be8', d:0.07, rot:14 },
      // BOTTOM-LEFT
      { t:'circle',  w:300, h:300, x:-10, y:63,  c:'#c3d6f5', d:0.02 },
      { t:'quarter', w:153, h:153, x:0,   y:66,  c:'#1a5fd7', d:0.05, rot:20, flip:true },
      { t:'domeDown',w:110, h:55,  x:26,  y:87,  c:'#f79a6b', d:0.09 },
      { t:'ring',    w:100, h:100, x:24,  y:87,  c:'#241f18', d:0.11 },
      { t:'circle',  w:58,  h:58,  x:11,  y:88,  c:'#f26327', d:0.13 },
      // BOTTOM-RIGHT
      { t:'circle',  w:270, h:270, x:83,  y:71,  c:'#fbd4be', d:0.02 },
      { t:'circle',  w:120, h:120, x:82,  y:72,  c:'#f26327', d:0.06 },
      { t:'circle',  w:60,  h:60,  x:90,  y:57,  c:'#c3d6f5', d:0.10 },
      { t:'squareO', w:88,  h:88,  x:70,  y:82,  c:'#241f18', d:0.11, rot:10 },
      { t:'quarter', w:76,  h:76,  x:92,  y:85,  c:'#1a5fd7', d:0.13, rot:180 },
      // SPREADERS (one per side)
      { t:'quarter', w:76,  h:76,  x:25,  y:8,   c:'#6b9be8', d:0.12, rot:-90 },
      { t:'squareO', w:72,  h:72,  x:45,  y:1,   c:'#241f18', d:0.12, rot:12 },
      { t:'domeDown',w:170, h:85,  x:53,  y:4,   c:'#1a5fd7', d:0.05, rot:-14 },
      { t:'domeUp',  w:120, h:60,  x:89,  y:44,  c:'#f26327', d:0.06 },
      { t:'square',  w:56,  h:56,  x:42,  y:92,  c:'#f26327', d:0.10, rot:12 },
      { t:'circle',  w:56,  h:56,  x:2,   y:47,  c:'#f79a6b', d:0.10 }
    ];
  }

  /* build (and rebuild on resize) the background shapes */
  function buildShapes() {
    var field = document.getElementById('field');
    field.innerHTML = '';
    var floats = ['float1', 'float2', 'float3', 'float4'];
    shapes = [];

    var vw = root.getBoundingClientRect().width || 1180;
    // shapes scale off a ~1400px reference so they don't crowd the text on
    // mid-size windows; grows proportionally on big monitors, shrinks on phones
    var VP;
    if (vw >= 620) { VP = Math.min(2.8, Math.max(0.78, vw / 1400)); }
    else { VP = 0.6 + (Math.max(320, vw) - 320) / 300 * 0.22; }

    shapeDefs().forEach(function (s, i) {
      var SC = (Math.max(s.w, s.h) < 100 ? 1.42 : 1.18) * VP;   // small shapes get a bit more
      var w = Math.round(s.w * SC), h = Math.round(s.h * SC);
      var ex = w - s.w, ey = h - s.h;                            // growth amount
      var inX = 26 * VP, inY = 22 * VP;                          // pull corners toward center
      var left = s.x < 50 ? 'calc(' + s.x + '% - ' + (ex - inX) + 'px)' : 'calc(' + s.x + '% - ' + inX + 'px)';
      var top  = s.y < 50 ? 'calc(' + s.y + '% - ' + (ey - inY) + 'px)' : 'calc(' + s.y + '% - ' + inY + 'px)';

      var outer = document.createElement('div');
      outer.style.cssText = 'position:absolute;left:' + left + ';top:' + top + ';width:' + w + 'px;height:' + h + 'px;z-index:' + (s.d > 0.09 ? 2 : 1) + ';';
      if (!reduce) {
        outer.style.animation = floats[i % 4] + ' ' + SPEED + ' ease-in-out infinite';
        outer.style.animationDelay = (-(i % 7) * 0.9).toFixed(1) + 's';
      }

      var inner = document.createElement('div');
      var st = 'width:100%;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform;';
      var r = s.rot ? ' rotate(' + s.rot + 'deg)' : '';
      if (s.flip) r += ' scaleX(-1)';
      if (s.t === 'circle')       st += 'border-radius:50%;background:' + s.c + ';';
      else if (s.t === 'ring')    st += 'border-radius:50%;border:2.5px solid ' + s.c + ';background:transparent;';
      else if (s.t === 'domeUp')  st += 'border-radius:999px 999px 0 0;background:' + s.c + ';';
      else if (s.t === 'domeDown')st += 'border-radius:0 0 999px 999px;background:' + s.c + ';';
      else if (s.t === 'quarter') st += 'border-radius:100% 0 0 0;background:' + s.c + ';';
      else if (s.t === 'square')  st += 'background:' + s.c + ';';
      else if (s.t === 'squareO') st += 'border:2.5px solid ' + s.c + ';background:transparent;';
      if (r) st += 'transform:' + r + ';';
      inner.style.cssText = st;

      outer.appendChild(inner);
      field.appendChild(outer);
      shapes.push({ outer: outer, inner: inner, def: s, baseRot: r });

      if (!reduce) {
        outer.style.pointerEvents = 'auto';
        (function (idx) { outer.addEventListener('pointerenter', function () { lunge(idx); }); })(i);
      }
    });
  }

  /* split the title into per-letter spans that pop out from the word's center */
  function buildLetters() {
    letters = [];
    var lines = root.querySelectorAll('.title .line');
    lines.forEach(function (line) {
      var text = line.textContent;
      line.textContent = '';
      var chars = text.split('');
      var mid = (chars.length - 1) / 2;
      chars.forEach(function (ch, k) {
        var s = document.createElement('span');
        s.textContent = ch;
        s.style.display = 'inline-block';
        s.style.willChange = 'transform,opacity';
        if (!reduce) {
          var dx = (mid - k) * 0.62 + (Math.random() * 2 - 1) * 0.3;
          var dy = (Math.random() * 2 - 1) * 0.5;
          var rot = (Math.random() * 2 - 1) * 60;
          s.style.opacity = '0';
          s.style.transform = 'translate(' + dx + 'em,' + dy + 'em) scale(.1) rotate(' + rot + 'deg)';
          s.style.transition = 'transform .8s cubic-bezier(.16,.9,.24,1.3), opacity .45s ease';
          s.style.transitionDelay = (Math.random() * 0.5).toFixed(3) + 's';   // random pop order
        }
        line.appendChild(s);
        letters.push(s);
      });
    });

    if (!reduce) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          letters.forEach(function (s) { s.style.opacity = '1'; s.style.transform = 'none'; });
        });
      });
      // after the intro, give each letter a snappy hover nudge
      setTimeout(function () {
        letters.forEach(function (s) {
          s.style.transition = 'transform .28s cubic-bezier(.2,.9,.2,1.2)';
          s.style.cursor = 'default';
          s.addEventListener('pointerenter', function () {
            s.style.transform = 'translateY(-.09em) rotate(' + ((Math.random() * 2 - 1) * 5) + 'deg) scale(1.07)';
          });
          s.addEventListener('pointerleave', function () { s.style.transform = 'none'; });
        });
      }, 1400);
    }
  }

  /* a hovered shape jumps away and shoves nearby neighbors */
  function lunge(i) {
    var src = shapes[i];
    var ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 40;
    push(src, Math.cos(ang) * dist, Math.sin(ang) * dist, (Math.random() * 2 - 1) * 40, 0.5);
    var b = root.getBoundingClientRect();
    var c0 = center(src, b);
    shapes.forEach(function (sh, j) {
      if (j === i) return;
      var c = center(sh, b);
      var dx = c.x - c0.x, dy = c.y - c0.y, dd = Math.hypot(dx, dy);
      if (dd < 260) {
        var f = (1 - dd / 260) * 36;
        push(sh, dx / dd * f, dy / dd * f, 0, 0.5);
        clearTimeout(sh._t);
        sh._t = setTimeout(function () { if (!sh._repel) sh.inner.style.transform = sh.baseRot || 'none'; }, 620);
      }
    });
    clearTimeout(src._t);
    src._t = setTimeout(function () { if (!src._repel) src.inner.style.transform = src.baseRot || 'none'; }, 620);
  }

  function push(sh, x, y, rot, dur) {
    sh.inner.style.transition = 'transform ' + dur + 's cubic-bezier(.2,.9,.2,1.25)';
    sh.inner.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + rot + 'deg)' + sh.baseRot;
  }

  function center(sh, b) {
    return { x: sh.def.x / 100 * b.width + sh.def.w / 2, y: sh.def.y / 100 * b.height + sh.def.h / 2 };
  }

  /* wire up: name reveal, cursor repel/parallax, and the Explore burst */
  function wire() {
    var box = root.querySelector('.namebox');
    var nb = root.querySelector('.namebar');

    if (!reduce && box && nb) {
      [box, nb].forEach(function (el) {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,-50%) scale(0)';
        el.style.transformOrigin = 'center';
      });
      // pop the name up large, hold, then settle to place
      revealName = function () {
        box.style.transition = 'transform .42s cubic-bezier(.3,.8,.3,1), opacity .25s ease';
        nb.style.transition = 'transform .42s cubic-bezier(.3,.8,.3,1), opacity .25s ease';
        [box, nb].forEach(function (el) { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(2.6)'; });
        setTimeout(function () {
          box.style.transition = 'transform .6s cubic-bezier(.25,1.1,.35,1)';
          nb.style.transition = 'transform .6s cubic-bezier(.25,1.1,.35,1) .05s';
          [box, nb].forEach(function (el) { el.style.transform = 'translate(-50%,-50%) scale(1)'; });
        }, 620);
      };
      setTimeout(function () { if (revealName) { revealName(); revealName = null; } }, 1600);

      // hover the name to grow it a little
      box.style.pointerEvents = 'auto';
      box.style.cursor = 'default';
      var grow = function () { [box, nb].forEach(function (el) { el.style.transition = 'transform .3s cubic-bezier(.25,1.1,.35,1)'; el.style.transform = 'translate(-50%,-50%) scale(1.35)'; }); };
      var restName = function () { [box, nb].forEach(function (el) { el.style.transition = 'transform .35s cubic-bezier(.25,1.1,.35,1)'; el.style.transform = 'translate(-50%,-50%) scale(1)'; }); };
      box.addEventListener('pointerenter', function () { if (!revealName) grow(); });
      box.addEventListener('pointerleave', function () { if (!revealName) restName(); });
    }

    if (!reduce) {
      // shapes repel from the cursor (with a touch of depth parallax)
      root.addEventListener('pointermove', function (e) {
        var b = root.getBoundingClientRect();
        var cx = e.clientX - b.left, cy = e.clientY - b.top;
        shapes.forEach(function (sh) {
          var c = center(sh, b);
          var dx = c.x - cx, dy = c.y - cy, dd = Math.hypot(dx, dy);
          var R = 240;
          if (dd < R) {
            sh._repel = true;
            var f = (1 - dd / R);
            var px = dx / (dd || 1) * f * 80, py = dy / (dd || 1) * f * 80;
            var par = sh.def.d * 40;
            sh.inner.style.transition = 'transform .18s ease-out';
            sh.inner.style.transform = 'translate(' + (px + (cx / b.width - 0.5) * par) + 'px,' + (py + (cy / b.height - 0.5) * par) + 'px)' + sh.baseRot;
          } else if (sh._repel) {
            sh._repel = false;
            sh.inner.style.transition = 'transform .6s cubic-bezier(.2,.8,.2,1)';
            sh.inner.style.transform = sh.baseRot || 'none';
          }
        });
      });
      root.addEventListener('pointerleave', function () {
        shapes.forEach(function (sh) {
          sh._repel = false;
          sh.inner.style.transition = 'transform .7s cubic-bezier(.2,.8,.2,1)';
          sh.inner.style.transform = sh.baseRot || 'none';
        });
      });
    }

    // clicking Explore scatters every shape, then springs them back
    var cta = root.querySelector('.cta');
    if (cta) cta.addEventListener('click', function (e) { e.preventDefault(); if (!reduce) burst(); });
  }

  function burst() {
    shapes.forEach(function (sh) {
      var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 150;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = (Math.random() * 2 - 1) * 220;
      sh.inner.style.transition = 'transform .45s cubic-bezier(.2,.9,.2,1.2)';
      sh.inner.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(1.12)' + sh.baseRot;
      setTimeout(function () {
        sh.inner.style.transition = 'transform .95s cubic-bezier(.3,1.25,.4,1)';
        sh.inner.style.transform = sh.baseRot || 'none';
      }, 480);
    });
  }

  /* init */
  buildShapes();
  buildLetters();
  wire();
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(buildShapes, 180); });
})();
</script>
</body>
</html>
